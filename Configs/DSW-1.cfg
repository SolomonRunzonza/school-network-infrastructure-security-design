hostname DSW-1
no ip domain-lookup
ip domain-name school.local

vlan 10
 name ADMIN
vlan 20
 name LEADERSHIP
vlan 30
 name STAFF
vlan 40
 name STUDENTS
vlan 50
 name SERVERS
vlan 99
 name MANAGEMENT

username admin privilege 15 secret Cisco123!
crypto key generate rsa
1024
ip ssh version 2

interface fa0/1
 description TO-ASW-1-FA0/3
 switchport mode trunk
 switchport trunk allowed vlan 10,99
 no shutdown

interface fa0/2
 description TO-ASW-2-FA0/3
 switchport mode trunk
 switchport trunk allowed vlan 20,99
 no shutdown

interface fa0/3
 description TO-CORE-SW1-FA0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

interface fa0/5
 description TO-CORE-SW2-FA0/1
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

interface fa0/10
 description DHCP-DNS-SERVER
 switchport mode access
 switchport access vlan 50
 spanning-tree portfast
 no shutdown

interface vlan 99
 ip address 192.168.99.2 255.255.255.224
 no shutdown

ip default-gateway 192.168.99.1

line vty 0 15
 login local
 transport input ssh

end
write memory
