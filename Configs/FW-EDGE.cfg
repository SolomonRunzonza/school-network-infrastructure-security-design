hostname FW-EDGE
no ip domain-lookup

interface g0/0
 description TO-CORE-SW1-FA0/24
 ip address 192.168.254.1 255.255.255.252
 ip nat inside
 no shutdown

interface g0/1
 description TO-ISP
 ip address 200.1.1.2 255.255.255.252
 ip nat outside
 no shutdown

interface g0/2
 description TO-CORE-SW2-FA0/3
 ip address 192.168.254.5 255.255.255.252
 ip nat inside
 no shutdown

access-list 1 permit 192.168.0.0 0.0.255.255

ip nat inside source list 1 interface g0/1 overload

ip route 192.168.10.0 255.255.255.224 192.168.254.2
ip route 192.168.20.0 255.255.255.240 192.168.254.2
ip route 192.168.30.0 255.255.255.192 192.168.254.2
ip route 192.168.40.0 255.255.255.192 192.168.254.2
ip route 192.168.50.0 255.255.255.224 192.168.254.2
ip route 192.168.99.0 255.255.255.224 192.168.254.2

ip route 192.168.10.0 255.255.255.224 192.168.254.6 10
ip route 192.168.20.0 255.255.255.240 192.168.254.6 10
ip route 192.168.30.0 255.255.255.192 192.168.254.6 10
ip route 192.168.40.0 255.255.255.192 192.168.254.6 10
ip route 192.168.50.0 255.255.255.224 192.168.254.6 10
ip route 192.168.99.0 255.255.255.224 192.168.254.6 10

ip access-list extended INTERNET-IN
 deny ip any 192.168.40.0 0.0.0.63
 deny ip any 192.168.99.0 0.0.0.31
 permit ip any any

interface g0/1
 ip access-group INTERNET-IN in

end
write memory
