hostname DSW-2
no ip domain-lookup
ip domain-name school.local

vlan 10
 name ADMIN
vlan 20
 name LEADERSHIP
vlan 30
 name STAFF
vlan 40
 name STUDENTS
vlan 50
 name SERVERS
vlan 99
 name MANAGEMENT

username admin privilege 15 secret Cisco123!
crypto key generate rsa
1024
ip ssh version 2

interface fa0/1
 description TO-ASW-3-FA0/3
 switchport mode trunk
 switchport trunk allowed vlan 30,99
 no shutdown

interface fa0/2
 description TO-ASW-4-FA0/7
 switchport mode trunk
 switchport trunk allowed vlan 40,99
 no shutdown

interface fa0/3
 description TO-CORE-SW1-FA0/2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

interface fa0/4
 description TO-CORE-SW2-FA0/2
 switchport mode trunk
 switchport trunk allowed vlan 10,20,30,40,50,99
 no shutdown

interface vlan 99
 ip address 192.168.99.3 255.255.255.224
 no shutdown

ip default-gateway 192.168.99.1

line vty 0 15
 login local
 transport input ssh

end
write memory
